<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="stylesheet" href="style.css">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>

   <div class="wrapper">
    <form action="">
       <a href="">
        <img src="logo-uncs.png" class="logo">
       </a>
        <h1><span1 class="baris-1">Selamat Datang di</span1><span class="baris-2">SINCAT</span> (Sistem Informasi Universitas Cinta Sejati)</h1>
        <h2 class="baris-3">Masuk</h2>
        <div class="input-box">
            <input type="text" placeholder="Nama Mahasiswa" required>
    <i class="bx bx-user"></i>
        </div>

       <div class="input-box">
    <input type="password" placeholder="NIM/Kata Sandi" required id="kata-sandi">
    <i class="bx bx-lock bx-flashing" id="lock"></i>
    
    <script>
        let lock = document.getElementById('lock');
        let kataSandi = document.getElementById('kata-sandi');
        
        lock.onclick = function() {
            if(kataSandi.type === "password") {
                kataSandi.type = "text";
                
                lock.className = "bx bx-lock-open bx-tada";
            } else {
                kataSandi.type ="password";
                
                lock.className = "bx bx-lock bx-flashing";
            }
        }
    </script>
</div>

        <div class="remember-forgot">
            <label>
                <input type="checkbox" name="" id="">
                Ingat Saya
            </label>
            <a href="#">Lupa Kata Sandi?</a>
        </div>

        <button type="submit" class="button">Masuk</button>

        <div class="Register-link">
            <p>Belum punya akun? 
            <a href="#">Daftar</a></p>
        </div>
    </form>

   </div> 
</body>
</html>
